[package]
name = "wrfgx"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/with-rob/wrfgx"
rust-version = "1.96"
description = "Low-level GPU primitives shared by every backend (Vulkan, OpenGL, WebGPU)."

[lib]
crate-type = ["rlib"]

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
must_use_candidate = "allow"
