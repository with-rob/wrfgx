[package]
name = "wrfgx"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/with-rob/wrfgx"
rust-version = "1.96"
description = "Zero-dependency GPU surface contract: formats, present modes and swapchain config."

[lib]
crate-type = ["rlib"]

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
must_use_candidate = "allow"

[features]
default = ["compute"]
compute = []
